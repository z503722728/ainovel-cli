<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AINovel · 写作终端</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ═══ 顶栏 ═══ -->
<header id="topbar">
  <div class="topbar-left">
    <span id="topbar-title">AINovel</span>
    <span class="dim" id="topbar-subtitle"></span>
  </div>
  <div class="topbar-right">
    <span id="topbar-status" class="badge idle">● 待命</span>
  </div>
</header>

<!-- ═══ 写作面板（默认） ═══ -->
<section id="panel-write" class="panel active">

  <!-- 流式输出区（占满剩余空间） -->
  <div id="stream-output">
    <div id="stream-content" class="empty-hint">
      <div class="welcome-icon">✍</div>
      <div>输入 /start 开始创作<br>或 /resume 恢复进度</div>
    </div>
  </div>

  <!-- 事件日志（可折叠） -->
  <details id="event-log-wrap">
    <summary id="event-log-toggle">📋 事件 <span id="event-count"></span></summary>
    <div id="event-log"></div>
  </details>

  <!-- 快捷操作栏 -->
  <div id="quick-bar">
    <button class="qbtn" data-cmd="/resume">▶ 恢复</button>
    <button class="qbtn" data-cmd="/pause">⏸ 暂停</button>
    <button class="qbtn" data-cmd="/approve">✓ 通过</button>
    <button class="qbtn" data-cmd="/skip">⏭ 跳过</button>
    <button class="qbtn" data-cmd="/help">? 帮助</button>
  </div>

  <!-- 命令输入（固定底部） -->
  <form id="cmd-form" autocomplete="off">
    <div id="cmd-hints"></div>
    <div class="cmd-row">
      <input id="cmd-input" type="text" placeholder="命令…" spellcheck="false">
      <button id="cmd-send" type="submit">发送</button>
    </div>
  </form>
</section>

<!-- ═══ 文件面板 ═══ -->
<section id="panel-files" class="panel">
  <div class="files-layout">
    <aside id="file-tree"></aside>
    <main id="file-viewer">
      <div class="empty-hint">选择文件查看</div>
    </main>
  </div>
</section>

<!-- ═══ 设置面板 ═══ -->
<section id="panel-settings" class="panel">
  <div class="settings-card">
    <h3>🎨 写作风格</h3>
    <select id="style-select"></select>
  </div>
  <div class="settings-card">
    <h3>🔍 审查模式</h3>
    <label class="toggle-row">
      <span>每章完成后暂停审查</span>
      <input type="checkbox" id="review-toggle">
    </label>
  </div>
  <div class="settings-card">
    <h3>📊 模型信息</h3>
    <pre id="model-info" class="dim">加载中…</pre>
  </div>
</section>

<!-- ═══ 底部 Tab 栏（移动端固定） ═══ -->
<nav id="tab-bar">
  <button class="tab active" data-tab="write">✍</button>
  <button class="tab" data-tab="files">📂</button>
  <button class="tab" data-tab="settings">⚙</button>
</nav>

<script src="/static/js/app.js"></script>
</body>
</html>
