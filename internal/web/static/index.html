<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AINovel — AI 小说创作</title>
<style>
/* ══════════════════════════════════════════════════
   AINovel Web — "Quiet Ink" Theme
   Warm dark palette · refined hierarchy · smooth motion
   ══════════════════════════════════════════════════ */
:root {
  --bg: #131316;
  --bg2: #1a1a1f;
  --bg3: #222228;
  --border: #2a2a30;
  --border-subtle: #222228;
  --text: #dcd9d4;
  --text2: #8a8680;
  --text3: #5a5752;
  --accent: #7c9aff;
  --accent-dim: rgba(124, 154, 255, 0.10);
  --accent-glow: rgba(124, 154, 255, 0.25);
  --success: #5cb88a;
  --success-dim: rgba(92, 184, 138, 0.12);
  --warn: #d4a843;
  --warn-dim: rgba(212, 168, 67, 0.12);
  --error: #d45a5a;
  --error-dim: rgba(212, 90, 90, 0.12);
  --bubble-user: #3d5a99;
  --bubble-ai: #1e1e24;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.15);
  --shadow: 0 2px 8px rgba(0,0,0,.2);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.3);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --dur: 180ms;
  --touch-min: 44px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* ── Custom Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

/* ── Focus Ring (accessibility) ── */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--bg2);
  border-bottom: 1px solid var(--border-subtle);
  min-height: 48px; flex-shrink: 0; gap: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
  position: relative; z-index: 10;
}
#topbar .title {
  font-size: 1rem; font-weight: 600; color: var(--accent);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  letter-spacing: -0.01em;
}
#topbar .progress {
  font-size: .78rem; color: var(--text2); white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums;
}
#topbar .progress .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--text3);
  transition: background-color .3s var(--ease), box-shadow .3s var(--ease);
}
#topbar .progress .dot.running {
  background: var(--success);
  box-shadow: 0 0 6px var(--success-dim);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* progress bar */
#topbar .progress-bar-wrap {
  width: 56px; height: 3px; border-radius: 2px;
  background: var(--bg3); overflow: hidden; flex-shrink: 0;
}
#topbar .progress-bar-fill {
  height: 100%; border-radius: 2px; background: var(--accent);
  transition: width .6s var(--ease); width: 0;
}

/* Project select in topbar */
#project-select {
  background: var(--bg3) !important; border: 1px solid var(--border) !important;
  border-radius: var(--radius-sm) !important; color: var(--text) !important;
  font-size: .78rem !important; padding: 5px 10px !important;
  max-width: 160px; transition: border-color var(--dur) var(--ease);
  cursor: pointer;
}
#project-select:hover { border-color: var(--text3) !important; }
#project-select:focus { border-color: var(--accent) !important; outline: none; }

/* Topbar action buttons (→ ＋ ✕) */
.proj-row {
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
#topbar .proj-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg3); color: var(--text2); font-size: .8rem;
  cursor: pointer; transition: all var(--dur) var(--ease); flex-shrink: 0;
}
#topbar .proj-btn:hover { background: var(--bg); color: var(--text); border-color: var(--text3); }
#topbar .proj-btn:active { transform: scale(0.92); }

/* ── Tabs ── */
#tabs {
  display: flex; flex-shrink: 0; background: var(--bg2);
  padding: 0 12px; position: relative;
  border-bottom: 1px solid var(--border-subtle);
}
#tabs button {
  flex: 1; height: var(--touch-min); border: none; background: none;
  color: var(--text3); font-size: .88rem; font-weight: 500;
  cursor: pointer; position: relative;
  transition: color var(--dur) var(--ease);
  max-width: 120px; letter-spacing: .01em;
}
#tabs button:hover { color: var(--text2); }
#tabs button.active { color: var(--text); }
#tabs button.active::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2.5px; border-radius: 2px 2px 0 0;
  background: var(--accent);
  animation: tabSlide .25s var(--ease);
}
@keyframes tabSlide {
  from { transform: scaleX(0); opacity: 0; }
  to { transform: scaleX(1); opacity: 1; }
}

/* ── Content Area ── */
#content { flex: 1; overflow: hidden; position: relative; }
.tab { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.tab.active { display: flex; }

/* ── Tab1: Writing ── */
#stream-area {
  flex: 1; overflow-y: auto; padding: 16px;
  font-family: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", ui-monospace, monospace;
  font-size: .82rem; line-height: 1.65; background: var(--bg);
  transition: opacity .3s var(--ease);
}
#stream-area.fading { opacity: .15; pointer-events: none; }
#stream-area .line { padding: 2.5px 0; }
#stream-area .ev-system { color: var(--text3); font-style: italic; }
#stream-area .ev-user { color: var(--accent); }
#stream-area .ev-success { color: var(--success); }
#stream-area .ev-warn { color: var(--warn); }
#stream-area .ev-error { color: var(--error); }
#stream-area .clear {
  color: var(--text3); font-style: italic; text-align: center;
  margin: 12px 0; font-size: .78rem; letter-spacing: .05em;
}
#stream-area .ev-stream { color: var(--text); white-space: pre-wrap; word-break: break-word; }
.tw-cursor { display: inline; animation: blink .8s step-end infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.think-block { margin: 4px 0; border: 1px solid var(--bg3); border-radius: 6px; overflow: hidden; }
.think-block summary { cursor: pointer; padding: 5px 10px; font-size: .72rem; color: var(--text3); background: var(--bg2); user-select: none; }
.think-block summary:hover { color: var(--text2); }
.think-block .think-content { padding: 5px 10px; font-size: .72rem; color: var(--text3); white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }

#stream-area .bubble {
  margin: 10px 0; padding: 12px 16px; border-radius: var(--radius-lg);
  max-width: 88%; line-height: 1.55; font-family: inherit; font-size: .85rem;
  transition: transform .15s var(--ease);
}
#stream-area .bubble.user {
  background: var(--bubble-user); color: #fff; margin-left: auto;
  border-bottom-right-radius: var(--radius-sm);
}
#stream-area .bubble.ai {
  background: var(--bubble-ai); border: 1px solid var(--border);
  margin-right: auto; border-bottom-left-radius: var(--radius-sm);
}
#stream-area .bubble .label {
  font-size: .68rem; color: var(--text3); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
}
#stream-area .bubble .draft {
  margin-top: 10px; padding: 10px 12px; background: rgba(255,255,255,.04);
  border-radius: var(--radius-sm); font-size: .78rem; white-space: pre-wrap;
  max-height: 200px; overflow-y: auto; border: 1px solid var(--border-subtle);
}

/* ── Input Area ── */
#input-area {
  flex-shrink: 0; padding: 10px 14px; background: var(--bg2);
  border-top: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 -2px 8px rgba(0,0,0,.08);
}
#input-area .row { display: flex; gap: 8px; align-items: center; }
#input-area textarea {
  flex: 1; min-height: var(--touch-min); max-height: 100px; resize: none;
  background: var(--bg3); border: 1.5px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-size: .9rem; padding: 10px 14px; font-family: inherit;
  outline: none; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
#input-area textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
#input-area textarea::placeholder { color: var(--text3); }

/* Unified button system */
#input-area button {
  height: var(--touch-min); min-width: var(--touch-min); padding: 0 16px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--bg3); color: var(--text2); font-size: .85rem; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: all var(--dur) var(--ease); white-space: nowrap;
}
#input-area button:hover { background: var(--bg); color: var(--text); border-color: var(--text3); }
#input-area button:active { transform: scale(0.96); }

#input-area button.primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
  font-weight: 600;
}
#input-area button.primary:hover { filter: brightness(1.1); }
#input-area button.primary:active { filter: brightness(0.9); transform: scale(0.96); }

#input-area button.danger {
  background: var(--error-dim); border-color: var(--error); color: var(--error);
}
#input-area button.danger:hover { background: var(--error); color: #fff; }
#input-area button.danger:active { transform: scale(0.96); }

#input-area button.warn {
  background: var(--warn-dim); border-color: var(--warn); color: var(--warn);
}
#input-area button.warn:hover { background: var(--warn); color: #000; }
#input-area button.warn:active { transform: scale(0.96); }

/* ── Suggestions ── */
#suggestions { display: flex; flex-wrap: wrap; gap: 6px; }
#suggestions .chip {
  padding: 6px 14px; border-radius: 20px;
  background: var(--accent-dim); border: 1px solid transparent;
  color: var(--accent); font-size: .8rem; cursor: pointer;
  transition: all var(--dur) var(--ease);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#suggestions .chip:hover { background: rgba(124,154,255,.18); border-color: var(--accent); }
#suggestions .chip:active { background: var(--accent); color: #fff; transform: scale(0.96); }

/* ── Tab2: Files ── */
#files-area {
  flex: 1; overflow-y: auto; padding: 4px 0; background: var(--bg);
}
#files-area .node {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; min-height: var(--touch-min);
  cursor: pointer; font-size: .88rem;
  border-bottom: 1px solid var(--border-subtle);
  transition: background var(--dur) var(--ease), padding-left var(--dur) var(--ease);
}
#files-area .node:hover { background: rgba(255,255,255,.03); }
#files-area .node:active { background: rgba(255,255,255,.05); transform: scale(0.995); }
#files-area .node .icon { font-size: 1.05rem; width: 24px; text-align: center; flex-shrink: 0; }
#files-area .node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#files-area .node .size {
  font-size: .72rem; color: var(--text3); flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
#files-area .node.dir { color: var(--accent); font-weight: 500; }
#files-area .node.dir:hover { padding-left: 20px; }
#files-area .node.file { color: var(--text); }
#files-area .breadcrumb {
  display: flex; align-items: center; padding: 10px 16px; gap: 4px;
  font-size: .8rem; color: var(--text3);
  border-bottom: 1px solid var(--border-subtle); overflow-x: auto;
  background: var(--bg2);
}
#files-area .breadcrumb span { cursor: pointer; color: var(--accent); white-space: nowrap; }
#files-area .breadcrumb span:hover { text-decoration: underline; }
#files-area .breadcrumb span.sep { color: var(--text3); cursor: default; }
#files-area .breadcrumb span.sep:hover { text-decoration: none; }
#files-area .empty { padding: 40px 16px; text-align: center; color: var(--text2); font-size: .85rem; }

/* ── Fullscreen Reader ── */
/* ── Reader Overlay (enhanced) ── */
#reader-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  display: none; flex-direction: column;
}
#reader-overlay.open { display: flex; }
#reader-overlay .reader-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--border-subtle);
  min-height: 48px; flex-shrink: 0; gap: 8px;
}
#reader-overlay .reader-top .filename {
  font-size: .88rem; font-weight: 600; color: var(--accent);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
#reader-overlay .reader-top .reader-actions {
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
#reader-overlay .reader-top button {
  height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg3); color: var(--text2); font-size: .8rem; cursor: pointer;
  transition: all var(--dur) var(--ease); white-space: nowrap;
}
#reader-overlay .reader-top button:hover { background: var(--bg); color: var(--text); border-color: var(--text3); }
#reader-overlay .reader-top button:active { transform: scale(0.95); }
#reader-overlay .reader-top button.tool-active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* Reader body: content */
.reader-body {
  flex: 1; display: flex; overflow: hidden; position: relative;
}

/* Reader content - code mode (default) */
.reader-content {
  flex: 1; overflow-y: auto; padding: 20px;
  font-family: "SF Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace;
  font-size: .82rem; line-height: 1.75;
  white-space: pre-wrap; word-break: break-word;
  transition: font-size .2s var(--ease), line-height .2s var(--ease), padding .2s var(--ease);
}

/* Reader content - novel/reading mode */
.reader-content.reading-mode {
  font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
  font-size: 1.05rem; line-height: 2; padding: 16px 20px;
  letter-spacing: .02em;
}
.reader-content.reading-mode .chapter-heading {
  display: none;
}
.reader-content.reading-mode p {
  text-indent: 2em; margin: 0 0 .8em;
}

/* Page-turning mode */
.reader-content.page-mode {
  overflow: hidden !important;
  padding: 0 !important;
  display: flex; flex-direction: column;
  scroll-snap-type: y mandatory;
}
.reader-content.page-mode .page {
  min-height: 100%; width: 100%; padding: 16px 20px;
  scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: flex-start;
  box-sizing: border-box;
}
.reader-page-hint {
  position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.7); color: var(--text2); font-size: .75rem;
  padding: 6px 14px; border-radius: 20px; pointer-events: none;
  opacity: 0; transition: opacity .3s var(--ease); z-index: 105;
}
.reader-page-hint.show { opacity: 1; }
/* Tap zones for page turning */
.reader-tap-left, .reader-tap-right {
  position: fixed; top: 48px; bottom: 32px; width: 35%; z-index: 101;
  display: none; align-items: center; justify-content: center;
}
.reader-tap-left { left: 0; }
.reader-tap-right { right: 0; }
.reader-tap-left:active, .reader-tap-right:active { background: rgba(255,255,255,.03); }
.reader-tap-left::after, .reader-tap-right::after {
  font-size: 1.5rem; color: var(--text3); opacity: 0; transition: opacity .15s;
}
.reader-tap-left:active::after { content: '◀'; opacity: .5; }
.reader-tap-right:active::after { content: '▶'; opacity: .5; }

/* JSON syntax highlighting */
.reader-content.json .key { color: var(--accent); }
.reader-content.json .string { color: var(--success); }
.reader-content.json .number { color: var(--warn); }
.reader-content.json .boolean { color: var(--error); }
.reader-content.json .null { color: var(--text3); }

/* Reader bottom bar */
.reader-bottom {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 14px; background: var(--bg2); border-top: 1px solid var(--border-subtle);
  font-size: .72rem; color: var(--text3); flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.reader-bottom .progress-track {
  flex: 1; height: 2px; background: var(--bg3); border-radius: 1px;
  margin: 0 12px; overflow: hidden; max-width: 120px;
}
.reader-bottom .progress-fill {
  height: 100%; background: var(--accent); border-radius: 1px;
  transition: width .15s var(--ease); width: 0;
}

/* Text selection popup */
.reader-sel-popup {
  position: fixed; z-index: 110;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 4px; display: none;
  animation: selPopIn .15s var(--ease);
}
.reader-sel-popup.show { display: flex; gap: 2px; }
@keyframes selPopIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.reader-sel-popup button {
  height: 32px; padding: 0 12px; border: none; border-radius: 4px;
  background: none; color: var(--text); font-size: .78rem; cursor: pointer;
  transition: background var(--dur) var(--ease); white-space: nowrap;
}
.reader-sel-popup button:hover { background: var(--bg3); }
.reader-sel-popup button:active { background: var(--accent-dim); color: var(--accent); }

/* ── Tab3: Settings ── */
#settings-area { flex: 1; overflow-y: auto; padding: 20px 16px; background: var(--bg); }
#settings-area .section { margin-bottom: 24px; }
#settings-area .section h3 {
  font-size: .75rem; color: var(--text3); text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 10px; font-weight: 600;
}
#settings-area .option {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: var(--bg2);
  border: 1px solid var(--border-subtle); border-radius: var(--radius);
  min-height: var(--touch-min);
  transition: border-color var(--dur) var(--ease);
}
#settings-area .option:hover { border-color: var(--border); }
#settings-area .option + .option { margin-top: 8px; }
#settings-area .option .label { font-size: .9rem; font-weight: 500; }
#settings-area .option .desc { font-size: .75rem; color: var(--text3); margin-top: 2px; }

#settings-area select {
  padding: 7px 12px; border-radius: var(--radius-sm);
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); font-size: .85rem; min-width: 140px;
  transition: border-color var(--dur) var(--ease); cursor: pointer;
}
#settings-area select:hover { border-color: var(--text3); }
#settings-area select:focus { border-color: var(--accent); outline: none; }

/* Toggle switch */
#settings-area .toggle {
  width: 48px; height: 28px; border-radius: 14px;
  background: var(--bg3); border: 1.5px solid var(--border);
  position: relative; cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  flex-shrink: 0;
}
#settings-area .toggle.on {
  background: var(--accent); border-color: var(--accent);
}
#settings-area .toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: transform var(--dur) var(--ease);
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
#settings-area .toggle.on::after { transform: translateX(20px); }

#settings-area .info-row {
  display: flex; justify-content: space-between; padding: 8px 0;
  font-size: .82rem; border-bottom: 1px solid var(--border-subtle);
}
#settings-area .info-row:last-child { border-bottom: none; }
#settings-area .info-row .k { color: var(--text3); }
#settings-area .info-row .v { color: var(--text); font-weight: 500; }

/* Settings inline form elements */
#settings-area textarea,
#settings-area input {
  background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); padding: 8px 10px; font-family: monospace; font-size: .82rem;
  transition: border-color var(--dur) var(--ease);
}
#settings-area textarea:focus,
#settings-area input:focus {
  border-color: var(--accent); outline: none;
}
#settings-area textarea { resize: vertical; width: 100%; }

/* Settings action buttons */
#settings-area .settings-btn {
  height: 32px; padding: 0 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg3); color: var(--text);
  font-size: .8rem; cursor: pointer; transition: all var(--dur) var(--ease);
}
#settings-area .settings-btn:hover { background: var(--bg); border-color: var(--text3); }
#settings-area .settings-btn:active { transform: scale(0.96); }
#settings-area .settings-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#settings-area .settings-btn.primary:hover { filter: brightness(1.1); }
#settings-area .settings-btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
#settings-area .settings-btn.danger:hover { background: var(--error-dim); }
#settings-area .settings-btn.success { background: var(--success); border-color: var(--success); color: #000; font-weight: 500; }
#settings-area .settings-btn.success:hover { filter: brightness(1.1); }

/* Global rules list item */
#settings-area .rule-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--bg2);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  margin-bottom: 6px; transition: border-color var(--dur) var(--ease);
}
#settings-area .rule-item:hover { border-color: var(--border); }
#settings-area .rule-item .rule-name {
  font-size: .85rem; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; flex: 1; color: var(--text);
}
#settings-area .rule-item .rule-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ── Toast ── */
#toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-4px);
  z-index: 200; padding: 10px 22px; border-radius: var(--radius);
  font-size: .85rem; font-weight: 500;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none;
  transition: opacity .25s var(--ease), transform .25s var(--ease);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { color: var(--error); border-color: var(--error); background: var(--error-dim); }

/* ── Celebration Overlay ── */
#celebrate-overlay {
  position: fixed; inset: 0; z-index: 250;
  display: flex; align-items: center; justify-content:center;
  opacity: 0; pointer-events: none; transition: opacity .4s var(--ease);
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
}
#celebrate-overlay.show { opacity: 1; }
#celebrate-overlay .celebrate-box {
  text-align: center; font-size: 1.4rem; color: var(--text);
  animation: celebrateIn .5s var(--ease);
}
#celebrate-overlay .celebrate-box .celebrate-icon {
  font-size: 3.5rem; display: block; margin-bottom: 10px;
}
@keyframes celebrateIn {
  0% { transform: scale(0) rotate(-10deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(2deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* ── Empty States ── */
.empty-card {
  margin: 20px; padding: 32px 24px;
  background: var(--bg2); border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: 12px;
}
.empty-card .empty-icon { font-size: 2.2rem; opacity: .8; }
.empty-card .empty-title { font-size: .95rem; font-weight: 600; color: var(--text); }
.empty-card .empty-desc { font-size: .8rem; color: var(--text3); line-height: 1.6; }
.empty-card .empty-cta {
  height: var(--touch-min); padding: 0 24px;
  border: none; border-radius: var(--radius); background: var(--accent); color: #fff;
  font-size: .85rem; font-weight: 600; cursor: pointer;
  transition: all var(--dur) var(--ease); margin-top: 4px;
}
.empty-card .empty-cta:hover { filter: brightness(1.1); }
.empty-card .empty-cta:active { transform: scale(0.96); filter: brightness(0.9); }
.empty-hint { color: var(--text3); font-size: .78rem; padding: 4px 0; line-height: 1.5; }

/* ── Spinner ── */
.spin {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Review Panel ── */
#review-panel {
  flex: 1; overflow-y: auto; padding: 16px; background: var(--bg);
  display: none; flex-direction: column; gap: 14px;
}
#review-panel.show { display: flex; }
#review-panel .rev-status {
  padding: 14px 16px; background: var(--success-dim);
  border: 1px solid rgba(92,184,138,.2); border-radius: var(--radius);
  font-size: .9rem; line-height: 1.5; color: var(--text);
}
#review-panel .rev-status .icon { color: var(--success); margin-right: 6px; }
#review-panel .rev-cards { display: flex; flex-direction: column; gap: 10px; }
.rev-card {
  background: var(--bg2); border: 1px solid var(--border-subtle);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color var(--dur) var(--ease);
}
.rev-card:hover { border-color: var(--border); }
.rev-card .rev-card-top { display: flex; align-items: center; justify-content: space-between; }
.rev-card .rev-card-top .name {
  font-size: .9rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.rev-card .rev-card-top .name .dot { margin-right: 2px; }
.rev-card .rev-card-preview {
  font-size: .78rem; color: var(--text3); line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rev-card .edit-btn {
  height: 36px; min-width: 36px; padding: 0 14px;
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  background: var(--accent-dim); color: var(--accent);
  font-size: .82rem; cursor: pointer; flex-shrink: 0;
  transition: all var(--dur) var(--ease);
}
.rev-card .edit-btn:hover { background: var(--accent); color: #fff; }
.rev-card .edit-btn:active { transform: scale(0.96); }

#review-panel .rev-actions { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
#review-panel .rev-actions button {
  width: 100%; height: var(--touch-min); padding: 0 16px;
  border-radius: var(--radius); font-size: .9rem; font-weight: 600;
  cursor: pointer; border: none;
  transition: all var(--dur) var(--ease);
}
#review-panel .rev-actions .btn-approve {
  background: var(--success); color: #000;
}
#review-panel .rev-actions .btn-approve:hover { filter: brightness(1.1); }
#review-panel .rev-actions .btn-approve:active { transform: scale(0.98); filter: brightness(0.9); }
#review-panel .rev-actions .btn-skip {
  background: var(--bg3); color: var(--text3);
  border: 1px solid var(--border-subtle);
  font-size: .82rem; font-weight: 400;
}
#review-panel .rev-actions .btn-skip:hover { background: var(--bg); color: var(--text2); border-color: var(--border); }
#review-panel .rev-actions .btn-skip:active { transform: scale(0.98); }

/* ── Review Editor Overlay ── */
#rev-editor-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 150;
  display: none; flex-direction: column;
}
#rev-editor-overlay.open { display: flex; }
#rev-editor-overlay .rev-editor-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--bg2);
  border-bottom: 1px solid var(--border-subtle);
  min-height: 48px; flex-shrink: 0; gap: 8px;
}
#rev-editor-overlay .rev-editor-top .filename {
  font-size: .9rem; font-weight: 600; color: var(--accent); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
#rev-editor-overlay .rev-editor-top button {
  height: 36px; min-width: 36px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg3); color: var(--text);
  font-size: .85rem; cursor: pointer; flex-shrink: 0;
  transition: all var(--dur) var(--ease);
}
#rev-editor-overlay .rev-editor-top button:hover { background: var(--bg); border-color: var(--text3); }
#rev-editor-overlay .rev-editor-top button.save-btn {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
#rev-editor-overlay .rev-editor-top button.save-btn:hover { filter: brightness(1.1); }
#rev-editor-overlay .rev-editor-content {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
}
#rev-editor-overlay .rev-editor-content textarea {
  flex: 1; width: 100%; background: var(--bg); border: none; color: var(--text);
  font-family: "SF Mono", "Cascadia Code", monospace; font-size: .82rem; line-height: 1.75;
  padding: 20px; resize: none; outline: none;
}
#rev-editor-overlay .rev-editor-content .readonly-preview {
  flex: 1; overflow-y: auto; padding: 20px; font-family: monospace; font-size: .82rem;
  line-height: 1.75; white-space: pre-wrap; word-break: break-word; color: var(--text2);
}
#rev-editor-overlay .rev-editor-content .readonly-preview.json-preview .key { color: var(--accent); }
#rev-editor-overlay .rev-editor-content .readonly-preview.json-preview .string { color: var(--success); }
#rev-editor-overlay .rev-editor-content .readonly-preview.json-preview .number { color: var(--warn); }
#rev-editor-overlay .rev-editor-content .readonly-preview.json-preview .boolean { color: var(--error); }
#rev-editor-overlay .rev-editor-content .readonly-preview.json-preview .null { color: var(--text3); }

/* ── Mobile Responsive ── */
@media (max-width: 480px) {
  #topbar {
    flex-wrap: wrap; gap: 6px 8px; padding: 8px 12px;
  }
  #topbar .title {
    font-size: .88rem; width: 100%; order: -1;
  }
  .proj-row {
    display: flex; align-items: center; gap: 4px;
    flex: 1 1 auto; min-width: 0;
  }
  #project-select {
    max-width: 110px !important; font-size: .72rem !important;
    padding: 3px 6px !important;
  }
  #topbar .proj-btn {
    width: 26px; height: 26px; font-size: .75rem;
  }
  #topbar .progress {
    font-size: .68rem; width: 100%;
    justify-content: flex-end;
  }
  #topbar .progress-bar-wrap { width: 36px; }

  #tabs button { font-size: .82rem; padding: 0 4px; }

  #input-area { padding: 8px 10px; }
  #input-area textarea { font-size: .85rem; padding: 8px 10px; }
  #input-area .row { gap: 6px; }
  #input-area button {
    padding: 0 10px; font-size: .8rem; min-width: 40px;
  }
  #input-area .action-row {
    gap: 6px;
  }
  #input-area .action-row button {
    flex: 1; min-width: 0; font-size: .78rem; padding: 0 8px;
  }

  #stream-area { padding: 10px; font-size: .78rem; }
  #settings-area { padding: 14px 12px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <span class="title" id="book-title">AINovel</span>
  <div class="proj-row">
    <select id="project-select" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;padding:4px 8px;max-width:180px">
      <option value="">加载中...</option>
    </select>
    <button class="proj-btn" onclick="switchProject(document.getElementById('project-select').value)" title="切换到选中项目">→</button>
    <button class="proj-btn" onclick="createProject()" title="新建项目">＋</button>
    <button class="proj-btn" onclick="deleteSelectedProject()" title="删除选中项目">✕</button>
  </div>
  <span class="progress" id="progress-bar">
    <span class="dot" id="state-dot"></span>
    <span class="progress-bar-wrap"><span class="progress-bar-fill" id="progress-fill"></span></span>
    <span id="progress-text">—</span>
  </span>
</div>

<!-- Tabs -->
<nav id="tabs">
  <button class="active" data-tab="writing">✍️ 写作</button>
  <button data-tab="files">📂 文件</button>
  <button data-tab="settings">⚙️ 设置</button>
</nav>

<!-- Content -->
<div id="content">

  <!-- Tab1: Writing -->
  <div class="tab active" id="tab-writing">
    <div id="stream-area"></div>
    <!-- Review Panel (shown when phase=review) -->
    <div id="review-panel">
      <div class="rev-status"><span class="icon">✅</span><span id="rev-status-msg">基础设定已生成，请审查</span></div>
      <div class="rev-cards" id="rev-cards"><div class="empty">加载中...</div></div>
      <div class="rev-actions">
        <button class="btn-approve" onclick="approveReview()">✅ 审查通过，开始写作</button>
        <button class="btn-skip" onclick="skipReview()">⏭ 跳过审查，直接写作</button>
      </div>
    </div>
    <div id="input-area">
      <div id="suggestions"></div>
      <div class="row">
        <textarea id="user-input" placeholder="输入创作需求，或与 AI 对话...&#10;Ctrl+S 直接开始创作" rows="2"></textarea>
        <button class="primary" id="btn-send" title="发送">发送</button>
      </div>
      <div class="row action-row" style="justify-content:space-between;flex-wrap:wrap">
        <button id="btn-start" class="primary">▶ 开始创作</button>
        <button id="btn-pause" class="warn">⏸ 暂停</button>
        <button id="btn-resume">▶ 恢复</button>
        <button id="btn-steer" class="danger">↗ 干预</button>
      </div>
    </div>
  </div>

  <!-- Tab2: Files -->
  <div class="tab" id="tab-files">
    <div class="breadcrumb" id="files-breadcrumb"><span data-dir="">📁 输出目录</span></div>
    <div id="files-area"></div>
  </div>

  <!-- Tab3: Settings -->
  <div class="tab" id="tab-settings">
    <div id="settings-area">
      <div class="section">
        <h3>创作风格</h3>
        <div class="option" style="flex-direction:column;align-items:stretch;gap:10px">
          <div><div class="label">写作风格</div><div class="desc">系统提示词注入的文学风格</div></div>
          <div style="display:flex;gap:6px;align-items:center">
            <select id="style-select" onchange="switchStyle(this.value)" style="flex:1">
              <option value="">加载中...</option>
            </select>
            <button class="settings-btn" onclick="editStyle()" title="编辑当前风格" style="width:32px;padding:0;justify-content:center">✏</button>
            <button class="settings-btn" onclick="toggleNewStyle()" title="新建风格" style="width:32px;padding:0;justify-content:center;font-size:1rem">+</button>
          </div>
          <div id="new-style-row" style="display:none;gap:6px">
            <input id="new-style-name" placeholder="风格名 (如 mystery)" style="flex:1">
            <button class="settings-btn primary" onclick="createStyle()">创建</button>
          </div>
          <div id="style-editor" style="display:none">
            <textarea id="style-editor-area" style="min-height:120px"></textarea>
            <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
              <button class="settings-btn primary" onclick="saveStyle()">保存</button>
              <button class="settings-btn danger" onclick="deleteStyle()">删除</button>
              <button class="settings-btn" onclick="closeStyleEditor()">取消</button>
            </div>
          </div>
        </div>
      </div>
      <div class="section">
        <h3>工作模式</h3>
        <div class="option">
          <div><div class="label">审阅模式</div><div class="desc">每阶段完成后暂停等待人工审阅</div></div>
          <div class="toggle" id="review-toggle" onclick="toggleReview()"></div>
        </div>
      </div>
      <div class="section">
        <h3>项目规则文件</h3>
        <div class="option" style="flex-direction:column;align-items:stretch;gap:10px">
          <div><div class="label">rules.md（项目规则）</div><div class="desc">编辑后保存即可生效，使用 Markdown 格式</div></div>
          <textarea id="rules-editor" style="min-height:120px"></textarea>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="settings-btn" onclick="loadRulesFile('project')">加载</button>
            <button class="settings-btn primary" onclick="saveRulesFile('project')">保存</button>
          </div>
        </div>
      </div>
      <div class="section">
        <h3>全局规则管理</h3>
        <div id="global-rules-list" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <input id="new-global-name" placeholder="新文件名 (如 my-style.md)" style="flex:1">
          <button class="settings-btn success" onclick="createGlobalRule()">+ 新建</button>
        </div>
        <div id="global-rules-editor" style="display:none;margin-top:10px">
          <div id="global-editor-title" style="font-size:.82rem;color:var(--accent);margin-bottom:6px"></div>
          <textarea id="global-editor-area" style="min-height:100px"></textarea>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button class="settings-btn" onclick="closeGlobalEditor()">取消</button>
            <button class="settings-btn primary" onclick="saveGlobalRule()">保存</button>
          </div>
        </div>
      </div>
      <div class="section">
        <h3>运行状态</h3>
        <div id="status-info"></div>
      </div>
    </div>
  </div>

</div>

<!-- Review Editor Overlay -->
<div id="rev-editor-overlay">
  <div class="rev-editor-top">
    <span class="filename" id="rev-editor-filename"></span>
    <button class="save-btn" id="rev-editor-save-btn" onclick="saveReviewFile()">💾 保存</button>
    <button onclick="closeReviewEditor()">← 返回</button>
  </div>
  <div class="rev-editor-content" id="rev-editor-content"></div>
</div>

<!-- Fullscreen file reader -->
<div id="reader-overlay">
  <div class="reader-top">
    <span class="filename" id="reader-filename"></span>
    <div class="reader-actions">
      <button id="reader-mode-btn" onclick="toggleReadingMode()" title="阅读/代码模式">📖</button>
      <button id="reader-page-btn" onclick="togglePageMode()" title="翻页模式">📄</button>
      <button onclick="readerFontSize(-1)" title="缩小字体">A-</button>
      <button onclick="readerFontSize(1)" title="放大字体">A+</button>
      <button onclick="closeReader()">✕</button>
    </div>
  </div>
  <div class="reader-body">
    <div class="reader-content" id="reader-content"></div>
  </div>
  <div class="reader-bottom">
    <span id="reader-stats">0 字</span>
    <div class="progress-track"><div class="progress-fill" id="reader-progress-fill"></div></div>
    <span id="reader-progress-pct">0%</span>
  </div>
  <div class="reader-sel-popup" id="reader-sel-popup">
    <button onclick="readerCopySel()">复制</button>
    <button onclick="readerWordCount()">字数</button>
  </div>
  <div class="reader-tap-left" onclick="readerPrevPage()"></div>
  <div class="reader-tap-right" onclick="readerNextPage()"></div>
  <div class="reader-page-hint" id="reader-page-hint"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Celebration Overlay -->
<div id="celebrate-overlay">
  <div class="celebrate-box">
    <span class="celebrate-icon" id="celebrate-icon">🎉</span>
    <span id="celebrate-text">🎉 完成！</span>
  </div>
</div>

<script>
// ── State ──
const STATE = {
  runtime: 'idle', phase: '', novelName: '', completed: 0, wordCount: 0,
  style: '', reviewMode: false,
  currentDir: '', // file browser
  chatHistory: [], // co-create messages
  isCoCreate: false,
};

// ── DOM refs ──
const $ = id => document.getElementById(id);
const streamArea = $('stream-area');
const userInput = $('user-input');
const suggestionsBox = $('suggestions');
const filesArea = $('files-area');
const filesBread = $('files-breadcrumb');
const readerOverlay = $('reader-overlay');
const readerContent = $('reader-content');
const readerFilename = $('reader-filename');
const toastEl = $('toast');
const stateDot = $('state-dot');
const reviewPanel = $('review-panel');
const revCards = $('rev-cards');
const revStatusMsg = $('rev-status-msg');
const revEditorOverlay = $('rev-editor-overlay');
const revEditorFilename = $('rev-editor-filename');
const revEditorContent = $('rev-editor-content');
const revEditorSaveBtn = $('rev-editor-save-btn');
let revEditingPath = '';

// ── Typewriter engine ──
const MAX_STREAM_NODES = 200;
let twBuf = '';           // pending chars to feed into typewriter
let twTimer = null;       // active tick timer
let twEl = null;          // current active line being typed into
let twChar = 0;           // next char index to output
let twMode = 'reply';     // 'reply' | 'thinking'
let thinkBlock = null;    // current open <details> for thinking
const TW_SPEED = 22;      // ms per character
let lastCelebratedChapter = 0; // track chapter completions, avoid false triggers

// ── Toast ──
let toastTimer;
function toast(msg, cls='') {
  toastEl.textContent = msg;
  toastEl.className = cls;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ── Tab switching ──
function switchTabToWriting() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  const writingBtn = document.querySelector('#tabs button[data-tab="writing"]');
  if (writingBtn) writingBtn.classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  $('tab-writing').classList.add('active');
  $('user-input').focus();
}

document.querySelectorAll('#tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const name = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    $('tab-' + name).classList.add('active');
    if (name === 'files') loadFiles();
    if (name === 'settings') refreshSettings();
  });
});

// ── Top bar update ──
function updateTopBar(snap) {
  if (!snap) return;
  const oldPhase = STATE.phase;
  STATE.runtime = snap.RuntimeState || 'idle';
  STATE.phase = snap.Phase || '';
  STATE.novelName = snap.NovelName || '';
  STATE.completed = snap.CompletedCount || 0;
  STATE.wordCount = snap.TotalWordCount || 0;
  STATE.style = snap.Style || '';

  $('book-title').textContent = STATE.novelName ? '📖 ' + STATE.novelName : 'AINovel · ' + (STATE.phase || '待机');
  $('progress-text').textContent =
    (STATE.runtime === 'running' ? '⚡' : '💤') + ' ' +
    STATE.phase + (STATE.completed ? ' · Ch.' + STATE.completed : '') +
    (STATE.wordCount ? ' · ' + STATE.wordCount.toLocaleString() + '字' : '');

  // Progress bar fill
  const fill = $('progress-fill');
  if (fill) {
    const total = Math.max(STATE.completed || 0, 1);
    fill.style.width = ((STATE.completed || 0) / total * 100) + '%';
  }

  stateDot.className = 'dot' + (STATE.runtime === 'running' ? ' running' : '');

  // Phase transition animation
  if (oldPhase && STATE.phase && oldPhase !== STATE.phase) {
    streamArea.classList.add('fading');
    setTimeout(() => {
      streamArea.classList.remove('fading');
    }, 300);
  }

  // Toggle review panel based on phase
  toggleReviewPanel();
}

// ── Smart auto-scroll ──
function shouldAutoScroll() {
  // Only auto-scroll if user is within 80px of the bottom
  const thresh = 80;
  return streamArea.scrollHeight - streamArea.scrollTop - streamArea.clientHeight < thresh;
}

function scrollToBottom() {
  streamArea.scrollTop = streamArea.scrollHeight;
}

// ── DOM node capping ──
function capStreamNodes() {
  while (streamArea.children.length > MAX_STREAM_NODES) {
    // Remove oldest 50 at once to avoid thrashing
    const remove = Math.min(50, streamArea.children.length - MAX_STREAM_NODES / 2);
    for (let i = 0; i < remove; i++) {
      if (streamArea.firstChild) streamArea.removeChild(streamArea.firstChild);
    }
  }
}

// ── Stream output ──
function appendLine(cls, text) {
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.textContent = text;
  streamArea.appendChild(div);
  if (shouldAutoScroll()) scrollToBottom();
  capStreamNodes();
}

function appendBubble(role, text, draft) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? '你' : 'AI';
  div.appendChild(label);
  const content = document.createElement('div');
  content.textContent = text;
  div.appendChild(content);
  if (draft) {
    const draftDiv = document.createElement('div');
    draftDiv.className = 'draft';
    draftDiv.textContent = draft;
    div.appendChild(draftDiv);
  }
  streamArea.appendChild(div);
  if (shouldAutoScroll()) scrollToBottom();
  capStreamNodes();
}

// ── Typewriter engine ──
function twTick() {
  if (twChar >= twBuf.length) {
    // Buffer exhausted — remove cursor, keep element for next chunk
    if (twEl) {
      twEl.innerHTML = twEl.innerHTML.replace(/<span class="tw-cursor">.*<\/span>$/, '');
      twEl = null;
    }
    clearInterval(twTimer);
    twTimer = null;
    twBuf = '';
    twChar = 0;
    return;
  }
  if (!twEl) {
    twEl = document.createElement('div');
    twEl.className = 'line ev-stream';
    streamArea.appendChild(twEl);
    capStreamNodes();
  }
  const c = twBuf[twChar];
  twChar++;
  twEl.innerHTML = escapeHTML(twBuf.slice(0, twChar)) + '<span class="tw-cursor">|</span>';
  if (shouldAutoScroll()) scrollToBottom();
}

function twFlush() {
  // Instantly finish current buffer
  if (twTimer) { clearInterval(twTimer); twTimer = null; }
  if (twEl && twBuf) {
    twEl.innerHTML = escapeHTML(twBuf);
    twEl = null;
  }
  twBuf = '';
  twChar = 0;
}

function twReset() {
  if (twTimer) { clearInterval(twTimer); twTimer = null; }
  twBuf = '';
  twChar = 0;
  twEl = null;
}

function twAppend(text) {
  twBuf += text;
  if (!twTimer) {
    twTimer = setInterval(twTick, TW_SPEED);
  }
}

function escapeHTML(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Thinking block (collapsible <details>) ──
function openThinkBlock() {
  thinkBlock = document.createElement('details');
  thinkBlock.className = 'think-block';
  thinkBlock.open = false;
  const summary = document.createElement('summary');
  summary.textContent = '💭 思考中...';
  thinkBlock.appendChild(summary);
  const content = document.createElement('div');
  content.className = 'think-content';
  thinkBlock.appendChild(content);
  streamArea.appendChild(thinkBlock);
  if (shouldAutoScroll()) scrollToBottom();
}

function feedThinkBlock(text) {
  if (!thinkBlock) { openThinkBlock(); }
  const content = thinkBlock.querySelector('.think-content');
  if (content) content.textContent += text;
  if (shouldAutoScroll()) scrollToBottom();
}

function closeThinkBlock() {
  if (!thinkBlock) return;
  const summary = thinkBlock.querySelector('summary');
  const content = thinkBlock.querySelector('.think-content');
  if (summary && content) {
    const len = content.textContent.length;
    summary.textContent = '💭 思考 (' + len + ' 字)';
  }
  thinkBlock = null;
}

// ── Stream reset ──
function streamReset() {
  twFlush();
  twReset();
  closeThinkBlock();
  twMode = 'reply';
}

// ── SSE ──
let es;
function connectSSE() {
  if (es) es.close();
  es = new EventSource('/api/stream');
  es.addEventListener('status', e => {
    try {
      const s = JSON.parse(e.data);
      updateTopBar(s);
    } catch(_) {}
  });
  es.addEventListener('event', e => {
    try {
      const ev = JSON.parse(e.data);
      appendLine('ev-' + (ev.Level || 'info'), '[' + (ev.Category || '?') + '] ' + (ev.Summary || ''));
    } catch(_) {}
  });
  es.addEventListener('clear', () => { streamReset(); appendLine('clear', '── 新一轮 ──'); });
  es.addEventListener('done', () => { streamReset(); appendLine('ev-system', '══ 创作结束 ══');
    // Chapter completion celebration — only when completed count actually increases
    const completed = STATE.completed || 0;
    if (completed > 0 && completed > (lastCelebratedChapter || 0)) {
      lastCelebratedChapter = completed;
      const overlay = $('celebrate-overlay');
      $('celebrate-icon').textContent = '🎉';
      $('celebrate-text').textContent = '第 ' + completed + ' 章完成！';
      overlay.classList.add('show');
      setTimeout(() => {
        overlay.classList.remove('show');
      }, 3000);
    }
  });
  es.onmessage = e => {
    // SSE data is JSON-encoded by backend (json.Marshal), parse first
    let raw;
    try {
      const parsed = JSON.parse(e.data);
      raw = typeof parsed === 'string' ? parsed : e.data;
    } catch(_) {
      raw = e.data;
    }
    // Raw text, may contain \x02 thinking separator
    // Format: [reply] \x02 [thinking] \x02 [reply] ...
    const parts = raw.split('\x02');
    for (let i = 0; i < parts.length; i++) {
      if (i > 0) {
        twMode = twMode === 'reply' ? 'thinking' : 'reply';
        if (twMode === 'reply') {
          twFlush();
          closeThinkBlock();
        } else {
          twFlush();
          openThinkBlock();
        }
      }
      if (parts[i]) {
        if (twMode === 'thinking') {
          // Thinking: instant append to <details>, no typewriter
          feedThinkBlock(parts[i]);
        } else {
          // Reply: split by newlines, typewriter each line
          const lines = parts[i].split('\n');
          for (let j = 0; j < lines.length; j++) {
            if (j > 0) twFlush(); // \n = finish current line, start new
            if (lines[j]) twAppend(lines[j]);
          }
        }
      }
    }
  };
  es.onerror = () => {
    streamReset();
    appendLine('ev-system', '⚠ SSE 连接中断，正在重连...');
  };
}
// Init — 先获取当前状态再连接 SSE
fetch('/api/status')
  .then(r => r.json())

// ── API helpers ──
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function apiRaw(method, path, body) {
  const opts = { method, headers: {'Content-Type':'text/plain'} };
  if (body !== undefined) opts.body = body;
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function sendCoCreate() {
  const text = userInput.value.trim();
  if (!text) return;
  const history = STATE.chatHistory;
  history.push({role:'user', content:text});
  appendBubble('user', text);
  userInput.value = '';
  clearSuggestions();

  try {
    const data = await api('POST', '/api/cocreate', {history});

    // Add AI response to history (use full raw for context)
    history.push({role:'assistant', content: data.Raw || data.Message});
    STATE.chatHistory = history;

    // Show AI message
    let aiText = data.Message || '';
    if (data.Prompt) {
      appendBubble('ai', aiText, data.Prompt);
    } else {
      appendBubble('ai', aiText);
    }

    // Show suggestions as chips
    if (data.Suggestions && data.Suggestions.length > 0) {
      data.Suggestions.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = s;
        chip.onclick = () => { userInput.value = s; userInput.focus(); };
        suggestionsBox.appendChild(chip);
      });
    }

    // If ready, show start hint
    if (data.Ready) {
      appendLine('ev-success', '✅ 需求已明确，可以直接开始创作');
      const startChip = document.createElement('span');
      startChip.className = 'chip';
      startChip.textContent = '开始创作这个故事';
      startChip.style.background = 'var(--accent)';
      startChip.style.color = '#fff';
      startChip.onclick = async () => {
        const prompt = data.Prompt || history.filter(h=>h.role==='user').map(h=>h.content).join('\n');
        await api('POST','/api/start',{prompt});
        toast('创作已启动');
        clearSuggestions();
        STATE.chatHistory = [];
      };
      suggestionsBox.appendChild(startChip);
    }

    appendLine('ev-error', '共创失败: ' + e.message);

// ── Recursive tree rendering ──
function renderTree(nodes, parent, basePath) {
  nodes.forEach(node => {
    const el = document.createElement('div');
    const isDir = node.type === 'dir';
    const path = basePath ? basePath + '/' + node.name : node.name;
    const icon = isDir ? '📁' : (node.name.endsWith('.md') ? '📝' : '📊');
    const sizeStr = node.size ? formatSize(node.size) : '';
    const indent = (basePath.match(/\//g) || []).length * 16;

    el.className = 'node ' + (isDir ? 'dir' : 'file');
    el.style.paddingLeft = (16 + indent) + 'px';
    el.innerHTML = '<span class="icon">' + icon + '</span><span class="name">' + node.name + '</span><span class="size">' + sizeStr + '</span>';

    if (isDir) {
      // Expandable directory
      let expanded = false;
      let childContainer = null;
      el.addEventListener('click', () => {
        if (!expanded) {
          childContainer = document.createElement('div');
          if (node.children && node.children.length > 0) {
            renderTree(node.children, childContainer, path);
          } else {
            childContainer.innerHTML = '<div class="empty" style="padding-left:' + (16 + indent + 16) + 'px">空目录</div>';
          }
          el.parentNode.insertBefore(childContainer, el.nextSibling);
          el.querySelector('.icon').textContent = '📂';
          expanded = true;
        } else {
          if (childContainer) {
            childContainer.remove();
            childContainer = null;
          }
          el.querySelector('.icon').textContent = '📁';
          expanded = false;
        }
      });
    } else {
      // File — click to open reader
      el.addEventListener('click', () => openReader(path));
    }
    parent.appendChild(el);
  });
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// ── File Reader (enhanced) ──
let readerFontSizePx = 0; // 0 = default, positive = larger, negative = smaller
let readerIsReadingMode = false;

async function openReader(path) {
  readerOverlay.classList.add('open');
  readerFilename.textContent = path;
  readerContent.innerHTML = '<div style="text-align:center;padding:40px"><span class="spin"></span> 加载中...</div>';
  readerContent.className = 'reader-content';
  readerFontSizePx = 0;
  readerIsReadingMode = false;
  readerPageMode = false;
  readerPages = [];
  $('reader-mode-btn').classList.remove('tool-active');
  $('reader-page-btn').classList.remove('tool-active');
  $('reader-progress-fill').style.width = '0%';
  $('reader-progress-pct').textContent = '0%';
  $('reader-stats').textContent = '0 字';
  hideReaderSelPopup();

  try {
    const data = await api('GET', '/api/files/' + encodeURIComponent(path));
    const isJson = data.type === 'json';
    const isMd = path.endsWith('.md') || path.endsWith('.txt');

    if (isJson) {
      readerContent.className = 'reader-content json';
      let content = data.content;
      try {
        const parsed = typeof content === 'string' ? JSON.parse(content) : content;
        readerContent.innerHTML = syntaxHighlightJSON(parsed);
      } catch(_) {
        readerContent.textContent = content;
      }
    } else {
      // Markdown / text — auto-enter reading mode for novel content
      readerContent.className = 'reader-content';
      const raw = data.content || '';
      readerContent.textContent = raw;

      // Auto-detect novel content and enter reading mode + page mode
      if (isMd && raw.length > 500) {
        toggleReadingMode();
        // Auto-enable page-turning mode for novel content
        setTimeout(() => {
          if (!readerPageMode) togglePageMode();
        }, 50);
      }
    }

    // Update stats
    updateReaderStats();

    // Scroll tracking
    readerContent.onscroll = () => updateReaderProgress();
  } catch(e) {
    readerContent.className = 'reader-content';
    readerContent.textContent = '读取失败: ' + e.message;
  }
}

function closeReader() {
  readerOverlay.classList.remove('open');
  readerContent.className = 'reader-content';
  readerContent.innerHTML = '';
  readerContent.onscroll = null;
  readerPageMode = false;
  readerPages = [];
  document.querySelector('.reader-tap-left').style.display = 'none';
  document.querySelector('.reader-tap-right').style.display = 'none';
  hideReaderSelPopup();
}

function readerFontSize(delta) {
  readerFontSizePx += delta * 2;
  readerFontSizePx = Math.max(-4, Math.min(8, readerFontSizePx));
  const base = readerIsReadingMode ? 1.05 : 0.82;
  const sz = base + readerFontSizePx * 0.06;
  readerContent.style.fontSize = sz + 'rem';
}

function toggleReadingMode() {
  // If page mode is on, turn it off first
  if (readerPageMode) {
    readerPageMode = false;
    readerContent.classList.remove('page-mode');
    readerPages = [];
    $('reader-page-btn').classList.remove('tool-active');
  }

  readerIsReadingMode = !readerIsReadingMode;
  const btn = $('reader-mode-btn');
  if (readerIsReadingMode) {
    readerContent.classList.add('reading-mode');
    btn.classList.add('tool-active');
    renderReadingMode();
  } else {
    readerContent.classList.remove('reading-mode');
    btn.classList.remove('tool-active');
    const text = readerContent.textContent;
    readerContent.textContent = text;
  }
  readerFontSizePx = 0;
  readerContent.style.fontSize = '';
  updateReaderStats();
}

function renderReadingMode() {
  const raw = readerContent.textContent;
  // Split by double newlines into paragraphs
  const lines = raw.split(/\n{2,}/);
  let html = '';
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    // Split by single newlines into <p> tags
    const paras = trimmed.split(/\n+/);
    for (const p of paras) {
      if (p.trim()) html += '<p>' + escapeHTML(p.trim()) + '</p>';
    }
  }
  readerContent.innerHTML = html;
}

function updateReaderStats() {
  const text = readerContent.textContent || '';
  const chars = text.replace(/\s/g, '').length;
  $('reader-stats').textContent = chars.toLocaleString() + ' 字';
}

function updateReaderProgress() {
  const el = readerContent;
  const scrollH = el.scrollHeight - el.clientHeight;
  if (scrollH <= 0) return;
  const pct = Math.round((el.scrollTop / scrollH) * 100);
  $('reader-progress-fill').style.width = pct + '%';
  $('reader-progress-pct').textContent = pct + '%';
}

// ── Page-turning mode ──
let readerPages = [];
let readerPageIdx = 0;
let readerPageMode = false;

function togglePageMode() {
  readerPageMode = !readerPageMode;
  const pageBtn = $('reader-page-btn');
  const tapL = document.querySelector('.reader-tap-left');
  const tapR = document.querySelector('.reader-tap-right');
  if (readerPageMode && readerIsReadingMode) {
    buildPages();
    readerContent.classList.add('page-mode');
    pageBtn.classList.add('tool-active');
    tapL.style.display = 'flex';
    tapR.style.display = 'flex';
    showPageHint();
  } else {
    readerPageMode = false;
    readerContent.classList.remove('page-mode');
    pageBtn.classList.remove('tool-active');
    tapL.style.display = 'none';
    tapR.style.display = 'none';
    if (readerPages.length > 0) {
      let html = '';
      for (const pg of readerPages) html += pg.html;
      readerContent.innerHTML = html;
      readerPages = [];
    }
  }
}

function buildPages() {
  const paras = readerContent.querySelectorAll('p, .chapter-heading');
  if (paras.length === 0) return;

  readerPages = [];
  let currentPage = { html: '', height: 0 };
  const pageHeight = readerContent.clientHeight - 48; // minus padding

  // Create a hidden measuring div
  const measurer = document.createElement('div');
  measurer.style.cssText = 'position:absolute;visibility:hidden;width:' + (readerContent.clientWidth - 56) + 'px;font:inherit;line-height:2;letter-spacing:.02em;';
  document.body.appendChild(measurer);

  for (const el of paras) {
    const clone = el.cloneNode(true);
    measurer.innerHTML = '';
    measurer.appendChild(clone);
    const elH = measurer.clientHeight;

    if (currentPage.height + elH > pageHeight && currentPage.html) {
      readerPages.push(currentPage);
      currentPage = { html: '', height: 0 };
    }
    currentPage.html += el.outerHTML;
    currentPage.height += elH;
  }
  if (currentPage.html) readerPages.push(currentPage);

  document.body.removeChild(measurer);

  // Render first page
  readerPageIdx = 0;
  renderPage();
}

function renderPage() {
  if (readerPageIdx < 0) readerPageIdx = 0;
  if (readerPageIdx >= readerPages.length) readerPageIdx = readerPages.length - 1;
  if (readerPages.length === 0) return;
  readerContent.innerHTML = '<div class="page">' + readerPages[readerPageIdx].html + '</div>';
  readerContent.scrollTop = 0;
  // Update progress
  const pct = Math.round(((readerPageIdx + 1) / readerPages.length) * 100);
  $('reader-progress-fill').style.width = pct + '%';
  $('reader-progress-pct').textContent = (readerPageIdx + 1) + '/' + readerPages.length;
}

function readerNextPage() {
  if (!readerPageMode) return;
  if (readerPageIdx < readerPages.length - 1) {
    readerPageIdx++;
    renderPage();
    showPageHint();
  } else {
    showPageHint('已是最后一页');
  }
}

function readerPrevPage() {
  if (!readerPageMode) return;
  if (readerPageIdx > 0) {
    readerPageIdx--;
    renderPage();
    showPageHint();
  } else {
    showPageHint('已是第一页');
  }
}

function showPageHint(text) {
  const hint = $('reader-page-hint');
  if (text) {
    hint.textContent = text;
  } else {
    hint.textContent = (readerPageIdx + 1) + ' / ' + readerPages.length;
  }
  hint.classList.add('show');
  clearTimeout(hideReaderSelPopup._hintTimer);
  hideReaderSelPopup._hintTimer = setTimeout(() => hint.classList.remove('show'), 1200);
}

// Keyboard support for page turning
document.addEventListener('keydown', e => {
  if (!readerOverlay.classList.contains('open') || !readerPageMode) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); readerNextPage(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); readerPrevPage(); }
});

// Swipe support for mobile page turning
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  if (!readerOverlay.classList.contains('open') || !readerPageMode) return;
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!readerOverlay.classList.contains('open') || !readerPageMode) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) readerNextPage();  // swipe left = next page
    else readerPrevPage();         // swipe right = prev page
  }
}, { passive: true });

// ── Review Panel ──
function toggleReviewPanel() {
  const isReview = STATE.phase === 'review' || STATE.phase === 'Review' || STATE.phase === 'chapter_review';
  const streamArea = $('stream-area');
  const inputArea = $('input-area');

  if (isReview) {
    reviewPanel.classList.add('show');
    streamArea.style.display = 'none';
    // Hide input during review
    if (inputArea) inputArea.style.display = 'none';
    loadReviewFiles();
  } else {
    reviewPanel.classList.remove('show');
    streamArea.style.display = '';
    if (inputArea) inputArea.style.display = '';
  }
}

async function loadReviewFiles() {
  revCards.innerHTML = '<div class="empty"><span class="spin"></span> 加载审查文件...</div>';
  try {
    const data = await fetch('/api/review-files').then(r => r.json());
    const files = data.files || [];

    if (files.length === 0) {
      revCards.innerHTML = '<div class="empty-card">' +
        '<span class="empty-icon">📝</span>' +
        '<span class="empty-title">等待 AI 生成基础设定...</span>' +
        '<span class="empty-desc">启动创作后，AI 将生成<br>角色、情节等基础设定文件</span>' +
        '</div>';
      return;
    }

    revCards.innerHTML = '';
    files.forEach(f => {
      const card = document.createElement('div');
      card.className = 'rev-card';

      const top = document.createElement('div');
      top.className = 'rev-card-top';
      top.innerHTML =
        '<span class="name"><span class="dot">📄</span>' + escapeHtml(f.name) + '</span>' +
        '<button class="edit-btn" data-path="' + escapeHtml(f.path) + '">✏编辑</button>';
      card.appendChild(top);

      const preview = document.createElement('div');
      preview.className = 'rev-card-preview';
      preview.textContent = f.preview || '(空文件)';
      card.appendChild(preview);

      revCards.appendChild(card);
    });

    // Bind edit buttons
    revCards.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        openReviewEditor(btn.dataset.path);
      });
    });
  } catch(e) {
    revCards.innerHTML = '<div class="empty">❌ 加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}

async function openReviewEditor(path) {
  revEditingPath = path;
  revEditorOverlay.classList.add('open');
  revEditorFilename.textContent = path;
  revEditorContent.innerHTML = '<div style="text-align:center;padding:40px"><span class="spin"></span> 加载中...</div>';

  try {
    const data = await api('GET', '/api/review-files/' + encodeURIComponent(path));

    if (data.type === 'json') {
      // JSON files: read-only preview with syntax highlighting
      revEditorSaveBtn.style.display = 'none';
      revEditorContent.innerHTML = '';
      const previewDiv = document.createElement('div');
      previewDiv.className = 'readonly-preview json-preview';
      try {
        const parsed = typeof data.content === 'string' ? JSON.parse(data.content) : data.content;
        previewDiv.innerHTML = syntaxHighlightJSON(parsed);
      } catch(_) {
        previewDiv.textContent = data.content;
      }
      revEditorContent.appendChild(previewDiv);
    } else {
      // .md files: editable textarea
      revEditorSaveBtn.style.display = '';
      revEditorContent.innerHTML = '';
      const ta = document.createElement('textarea');
      ta.value = data.content;
      ta.setAttribute('spellcheck', 'false');
      revEditorContent.appendChild(ta);
      ta.focus();
    }
  } catch(e) {
    revEditorContent.innerHTML = '<div style="text-align:center;padding:40px;color:var(--error)">读取失败: ' + escapeHtml(e.message) + '</div>';
  }
}

async function saveReviewFile() {
  if (!revEditingPath) return;
  const ta = revEditorContent.querySelector('textarea');
  if (!ta) { toast('无法保存：当前为只读模式', 'error'); return; }

  const content = ta.value;
  try {
    await apiRaw('POST', '/api/review-files/' + encodeURIComponent(revEditingPath), content);
    toast('已保存: ' + revEditingPath);
    closeReviewEditor();
    // Refresh file cards
    loadReviewFiles();
  } catch(e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

function closeReviewEditor() {
  revEditorOverlay.classList.remove('open');
  revEditorContent.innerHTML = '';
  revEditingPath = '';
}

async function approveReview() {
  try {
    const url = STATE.phase === 'chapter_review' ? '/api/chapter-review/approve' : '/api/review/approve';
    await api('POST', url);
    toast('审查通过，继续创作');
    toggleReviewPanel();
  } catch(e) {
    toast('操作失败: ' + e.message, 'error');
  }
}

async function skipReview() {
  try {
    const url = STATE.phase === 'chapter_review' ? '/api/chapter-review/skip' : '/api/review/skip';
    await api('POST', url);
    toast('已跳过审查，继续创作');
    toggleReviewPanel();
  } catch(e) {
    toast('操作失败: ' + e.message, 'error');
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function syntaxHighlightJSON(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^"\\])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
      let cls = 'number';
      if (/^"/.test(m)) {
        if (/:$/.test(m)) { cls = 'key'; m = m.slice(0,-1) + '</span>:'; return '<span class="' + cls + '">' + m; }
        else cls = 'string';
      } else if (/true|false/.test(m)) cls = 'boolean';
      else if (/null/.test(m)) cls = 'null';
      return '<span class="' + cls + '">' + m + '</span>';
    });
}

// ── Settings ──
function refreshSettings() {
  fetch('/api/status')
    .then(r => r.json())
    .then(snap => {
      updateTopBar(snap);

      // Style selector - dynamic load
      const sel = $('style-select');
      fetch('/api/styles')
        .then(r => r.json())
        .then(styles => {
          sel.innerHTML = styles.map(s =>
            '<option value="' + s.name + '"' + (s.is_active ? ' selected' : '') + '>' + s.label + '</option>'
          ).join('');
        })
        .catch(() => {
          // fallback if API not available
        });

      // Review toggle
      const toggle = $('review-toggle');
      toggle.className = 'toggle' + (STATE.reviewMode ? ' on' : '');

      // Status info
      $('status-info').innerHTML =
        '<div class="info-row"><span class="k">提供者</span><span class="v">' + (snap.Provider || '—') + '</span></div>' +
        '<div class="info-row"><span class="k">模型</span><span class="v">' + (snap.ModelName || '—') + '</span></div>' +
        '<div class="info-row"><span class="k">运行状态</span><span class="v">' + STATE.runtime + '</span></div>' +
        '<div class="info-row"><span class="k">阶段</span><span class="v">' + (STATE.phase || '—') + '</span></div>' +
        '<div class="info-row"><span class="k">已完成</span><span class="v">' + STATE.completed + ' 章</span></div>' +
        '<div class="info-row"><span class="k">总字数</span><span class="v">' + STATE.wordCount.toLocaleString() + '</span></div>';

      // Load global rules list
      loadGlobalRulesList();
    })
    .catch(e => {
      $('status-info').innerHTML = '<div class="empty">⚠ 无法获取状态: ' + e.message + '</div>';
    });
}

// ── Style Switching ──
async function switchStyle(style) {
  try {
    const r = await api('POST', '/api/style/current', {style});
    toast('风格已切换为: ' + style);
  } catch(e) {
    toast('切换失败: ' + e.message, 'error');
    // Revert selector
    const sel = $('style-select');
    const snapStyle = STATE.style || 'default';
    for (let i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === snapStyle) {
        sel.selectedIndex = i;
        break;
      }
    }
  }
}

// ── Style CRUD ──
let editingStyleName = null;

function toggleNewStyle() {
  const row = $('new-style-row');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
  if (row.style.display === 'flex') $('new-style-name').focus();
}

async function createStyle() {
  const name = $('new-style-name').value.trim();
  if (!name) { toast('请输入风格名称', 'error'); return; }
  editingStyleName = name;
  $('style-editor').style.display = 'block';
  $('style-editor-area').value = '# 写作风格: ' + name + '\n\n在此定义你的写作风格提示词...\n';
  $('style-editor-area').focus();
  $('new-style-row').style.display = 'none';
  $('new-style-name').value = '';
}

async function editStyle() {
  const sel = $('style-select');
  const name = sel.value;
  if (!name) { toast('请先选择风格', 'error'); return; }
  try {
    const data = await api('GET', '/api/styles/' + encodeURIComponent(name));
    editingStyleName = name;
    $('style-editor').style.display = 'block';
    $('style-editor-area').value = data.content || '';
  } catch(e) { toast('加载失败: ' + e.message, 'error'); }
}

async function saveStyle() {
  const content = $('style-editor-area').value;
  try {
    await apiRaw('PUT', '/api/styles/' + encodeURIComponent(editingStyleName), content);
    toast('已保存: ' + editingStyleName);
    closeStyleEditor();
    refreshSettings();
  } catch(e) { toast('保存失败: ' + e.message, 'error'); }
}

async function deleteStyle() {
  if (!confirm('确定删除风格 ' + editingStyleName + '？')) return;
  try {
    await api('DELETE', '/api/styles/' + encodeURIComponent(editingStyleName));
    toast('已删除: ' + editingStyleName);
    closeStyleEditor();
    refreshSettings();
  } catch(e) { toast('删除失败: ' + e.message, 'error'); }
}

function closeStyleEditor() {
  $('style-editor').style.display = 'none';
  editingStyleName = null;
}

function toggleReview() {
  STATE.reviewMode = !STATE.reviewMode;
  $('review-toggle').className = 'toggle' + (STATE.reviewMode ? ' on' : '');
  toast(STATE.reviewMode ? '审阅模式: 开' : '审阅模式: 关');
}

// ── Project Rules Editor ──
async function loadRulesFile(source, name) {
  let url = '/api/rules/file?source=' + source;
  if (name) url += '&name=' + encodeURIComponent(name);

  try {
    const data = await (await fetch(url)).json();

    if (source === 'project') {
      $('rules-editor').value = data.content || '';
      if (!data.exists) toast('rules.md 不存在，保存后将自动创建');
    } else {
      // Global rule being edited
      $('global-editor-area').value = data.content || '';
      $('global-editor-title').textContent = '编辑: ' + data.name;
      $('global-rules-editor').style.display = 'block';
      window._editingGlobalRule = data.name;
    }
  } catch(e) {
    toast('加载失败: ' + e.message, 'error');
  }
}

async function saveRulesFile(source, name) {
  let url = '/api/rules/file?source=' + source;
  if (name) url += '&name=' + encodeURIComponent(name);

  let content;
  if (source === 'project') {
    content = $('rules-editor').value;
  } else {
    content = $('global-editor-area').value;
  }

  try {
    await (await fetch(url, {
      method: 'POST',
      body: content,
    })).json();
    toast(source === 'project' ? '项目规则已保存' : '已保存: ' + name);
  } catch(e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

// ── Global Rules Management ──
async function loadGlobalRulesList() {
  try {
    const sources = await (await fetch('/api/rules/sources')).json();
    const globalFiles = sources.filter(s => s.kind === 'global');

    const list = $('global-rules-list');
    if (globalFiles.length === 0) {
      list.innerHTML = '<div class="empty-hint">📋 暂无全局规则文件<br>添加 .md 文件来扩展 AI 行为规则</div>';
      return;
    }

    list.innerHTML = globalFiles.map(f => {
      const name = f.source.split('/').pop();
      return '<div class="rule-item">' +
        '<span class="rule-name">📝 ' + name + '</span>' +
        '<div class="rule-actions">' +
        '<button class="settings-btn" onclick="editGlobalRule(\'' + name + '\')" style="height:28px;padding:0 10px;font-size:.75rem">编辑</button>' +
        '<button class="settings-btn danger" onclick="deleteGlobalRule(\'' + name + '\')" style="height:28px;padding:0 10px;font-size:.75rem">删除</button>' +
        '</div></div>';
    }).join('');
  } catch(e) {
    $('global-rules-list').innerHTML = '<div style="color:var(--error);font-size:.82rem">加载失败: ' + e.message + '</div>';
  }
}

function editGlobalRule(name) {
  loadRulesFile('global', name);
}

async function saveGlobalRule() {
  const name = window._editingGlobalRule;
  if (!name) return;
  await saveRulesFile('global', name);
  closeGlobalEditor();
  loadGlobalRulesList();
}

function closeGlobalEditor() {
  $('global-rules-editor').style.display = 'none';
  $('global-editor-area').value = '';
  window._editingGlobalRule = null;
}

async function createGlobalRule() {
  const name = $('new-global-name').value.trim();
  if (!name) { toast('请输入文件名', 'error'); return; }
  if (!name.endsWith('.md')) {
    toast('文件名必须以 .md 结尾', 'error');
    return;
  }
  // basic safety check
  if (name.includes('/') || name.startsWith('.')) {
    toast('无效的文件名', 'error');
    return;
  }

  try {
    await (await fetch('/api/rules/file?source=global&name=' + encodeURIComponent(name), {
      method: 'POST',
      body: '# ' + name.replace('.md', '') + '\n\n（在此编辑你的全局规则）\n',
    })).json();
    $('new-global-name').value = '';
    toast('已创建: ' + name);
    loadGlobalRulesList();
    editGlobalRule(name);
  } catch(e) {
    toast('创建失败: ' + e.message, 'error');
  }
}

async function deleteGlobalRule(name) {
  if (!confirm('确定删除 ' + name + ' ？')) return;

  try {
    await (await fetch('/api/rules/file?source=global&name=' + encodeURIComponent(name), {
      method: 'DELETE',
    })).json();
    toast('已删除: ' + name);
    loadGlobalRulesList();
    if (window._editingGlobalRule === name) closeGlobalEditor();
  } catch(e) {
    toast('删除失败: ' + e.message, 'error');
  }
}
